<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Wall Clock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            transition: background-color 0.5s ease;
        }
        
        .time-display {
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
        }

        .fade-transition {
            transition: opacity 0.4s ease-in-out, transform 0.4s ease;
        }

        .cursor-hidden {
            cursor: none;
        }
        
        /* Custom scrollbar for settings modal */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-black text-white h-screen w-screen overflow-hidden flex flex-col items-center justify-center m-0 select-none">

    <!-- Main Clock Container -->
    <div class="flex flex-col items-center justify-center w-full px-4 text-center">
        <!-- Time -->
        <div class="flex items-baseline space-x-2 md:space-x-4">
            <h1 id="time" class="time-display font-bold leading-none text-[20vw] sm:text-[18vw] tracking-tighter drop-shadow-[0_0_15px_rgba(255,255,255,0.1)] transition-colors duration-300">
                00:00:00
            </h1>
            <span id="ampm" class="text-[5vw] sm:text-[4vw] font-medium text-gray-400 hidden">AM</span>
        </div>
        
        <!-- Date -->
        <h2 id="date" class="text-[4vw] sm:text-[3vw] lg:text-[2vw] font-medium text-gray-400 mt-2 sm:mt-0 tracking-wide uppercase">
            Loading Date...
        </h2>
    </div>

    <!-- Floating Controls (Auto-hides on idle) -->
    <div id="controls" class="fade-transition fixed bottom-6 right-6 flex space-x-3 bg-gray-900/50 backdrop-blur-md p-3 rounded-2xl border border-gray-700/50 shadow-2xl z-40">
        
        <!-- Toggle 12/24 Hour -->
        <button id="formatToggle" class="p-3 rounded-xl hover:bg-gray-700/70 transition-colors text-gray-300 hover:text-white" title="Toggle 12/24 Hour Format">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
        </button>

        <!-- Change Color Theme -->
        <button id="colorToggle" class="p-3 rounded-xl hover:bg-gray-700/70 transition-colors text-gray-300 hover:text-white" title="Change Color Theme">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
            </svg>
        </button>

        <!-- Fullscreen Toggle -->
        <button id="fullscreenToggle" class="p-3 rounded-xl hover:bg-gray-700/70 transition-colors text-gray-300 hover:text-white" title="Toggle Fullscreen">
            <svg id="fs-icon-enter" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
            </svg>
            <svg id="fs-icon-exit" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden">
                <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path>
            </svg>
        </button>

        <!-- Settings Modal Toggle -->
        <button id="settingsToggle" class="p-3 rounded-xl hover:bg-gray-700/70 transition-colors text-gray-300 hover:text-white" title="Settings">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </button>
    </div>

    <!-- Settings Modal Overlay -->
    <div id="settingsModal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-gray-900 border border-gray-700 rounded-3xl shadow-2xl w-full max-w-md overflow-hidden transform scale-95 transition-transform duration-300" id="settingsContent">
            
            <!-- Header -->
            <div class="px-6 py-5 border-b border-gray-800 flex justify-between items-center bg-gray-900/80">
                <h3 class="text-xl font-semibold text-white tracking-wide">Settings</h3>
                <button id="closeModal" class="text-gray-400 hover:text-white transition-colors p-1 rounded-lg hover:bg-gray-800">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>

            <!-- Scrollable Content -->
            <div class="px-6 py-4 max-h-[65vh] overflow-y-auto">

                <!-- Premium / Future Add-ons -->
                <div class="space-y-4 mb-6">
                    <h4 class="text-xs font-bold text-amber-500 uppercase tracking-wider mb-2 flex items-center">
                        <svg class="w-4 h-4 mr-1" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 2a4 4 0 00-4 4v1H5a1 1 0 00-.994.89l-1 9A1 1 0 004 18h12a1 1 0 00.994-1.11l-1-9A1 1 0 0015 7h-1V6a4 4 0 00-4-4zm2 5V6a2 2 0 10-4 0v1h4zm-6 3a1 1 0 112 0 1 1 0 01-2 0zm7-1a1 1 0 100 2 1 1 0 000-2z" clip-rule="evenodd"></path></svg>
                        Pro Features (Coming Soon)
                    </h4>
                    
                    <div class="flex justify-between items-center opacity-60">
                        <div class="flex items-center">
                            <span class="text-gray-300">Water Reminders</span>
                        </div>
                        <span class="text-[10px] uppercase font-bold bg-gray-800 text-gray-400 px-2 py-1 rounded border border-gray-700">Locked</span>
                    </div>

                    <div class="flex justify-between items-center opacity-60">
                        <div class="flex items-center">
                            <span class="text-gray-300">Custom Countdowns</span>
                        </div>
                        <span class="text-[10px] uppercase font-bold bg-gray-800 text-gray-400 px-2 py-1 rounded border border-gray-700">Locked</span>
                    </div>
                    
                    <div class="flex justify-between items-center opacity-60">
                        <div class="flex items-center">
                            <span class="text-gray-300">Collaborative Sync</span>
                        </div>
                        <span class="text-[10px] uppercase font-bold bg-gray-800 text-gray-400 px-2 py-1 rounded border border-gray-700">Locked</span>
                    </div>
                </div>

                <!-- Meet The Developer Section -->
                <div class="space-y-4 pt-6 border-t border-gray-800">
                    <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Meet the Developer</h4>
                    <p class="text-sm text-gray-400 mb-3">Crafted with precision. Connect with me online.</p>
                    
                    <div class="flex space-x-4">
                        <!-- REPLACE '#' WITH YOUR GITHUB LINK -->
                        <a href="https://github.com/Anupamdex" target="_blank" class="flex items-center px-3 py-2 bg-gray-800 hover:bg-gray-700 rounded-lg text-sm text-gray-300 hover:text-white transition-colors border border-gray-700">
                            <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                <path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd"></path>
                            </svg>
                            GitHub
                        </a>
                        
                        <!-- REPLACE '#' WITH YOUR INSTAGRAM LINK -->
                        <a href="https://instagram.com/anupam_dex" target="_blank" class="flex items-center px-3 py-2 bg-gray-800 hover:bg-gray-700 rounded-lg text-sm text-gray-300 hover:text-pink-400 transition-colors border border-gray-700">
                            <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                <path fill-rule="evenodd" d="M12.315 2c2.43 0 2.784.013 3.808.06 1.064.049 1.791.218 2.427.465a4.902 4.902 0 011.772 1.153 4.902 4.902 0 011.153 1.772c.247.636.416 1.363.465 2.427.048 1.067.06 1.407.06 4.123v.08c0 2.643-.012 2.987-.06 4.043-.049 1.064-.218 1.791-.465 2.427a4.902 4.902 0 01-1.153 1.772 4.902 4.902 0 01-1.772 1.153c-.636.247-1.363.416-2.427.465-1.067.048-1.407.06-4.123.06h-.08c-2.643 0-2.987-.012-4.043-.06-1.064-.049-1.791-.218-2.427-.465a4.902 4.902 0 01-1.772-1.153 4.902 4.902 0 01-1.153-1.772c-.247-.636-.416-1.363-.465-2.427-.047-1.024-.06-1.379-.06-3.808v-.63c0-2.43.013-2.784.06-3.808.049-1.064.218-1.791.465-2.427a4.902 4.902 0 011.153-1.772A4.902 4.902 0 015.45 2.525c.636-.247 1.363-.416 2.427-.465C8.901 2.013 9.256 2 11.685 2h.63zm-.081 1.802h-.468c-2.456 0-2.784.011-3.807.058-.975.045-1.504.207-1.857.344-.467.182-.8.398-1.15.748-.35.35-.566.683-.748 1.15-.137.353-.3.882-.344 1.857-.047 1.023-.058 1.351-.058 3.807v.468c0 2.456.011 2.784.058 3.807.045.975.207 1.504.344 1.857.182.466.399.8.748 1.15.35.35.683.566 1.15.748.353.137.882.3 1.857.344 1.054.048 1.37.058 4.041.058h.08c2.597 0 2.917-.01 3.96-.058.976-.045 1.505-.207 1.858-.344.466-.182.8-.398 1.15-.748.35-.35.566-.683.748-1.15.137-.353.3-.882.344-1.857.048-1.055.058-1.37.058-4.041v-.08c0-2.597-.01-2.917-.058-3.96-.045-.976-.207-1.505-.344-1.858a3.097 3.097 0 00-.748-1.15 3.098 3.098 0 00-1.15-.748c-.353-.137-.882-.3-1.857-.344-1.023-.047-1.351-.058-3.807-.058zM12 6.865a5.135 5.135 0 110 10.27 5.135 5.135 0 010-10.27zm0 1.802a3.333 3.333 0 100 6.666 3.333 3.333 0 000-6.666zm5.338-3.205a1.2 1.2 0 110 2.4 1.2 1.2 0 010-2.4z" clip-rule="evenodd"></path>
                            </svg>
                            Instagram
                        </a>
                    </div>
                </div>
            </div>

            <!-- Footer / Buy Me A Coffee CTA -->
            <div class="p-5 bg-gray-800/50 border-t border-gray-800 text-center">
                <!-- REPLACE '#' WITH YOUR BUY ME A COFFEE LINK -->
                <a href="#" target="_blank" class="w-full flex items-center justify-center bg-[#FFDD00] hover:bg-[#FFEA55] text-black font-bold py-3 rounded-xl transition-all shadow-lg shadow-[#FFDD00]/10 hover:shadow-[#FFDD00]/30 transform hover:-translate-y-0.5">
                    <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
                        <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
                        <line x1="6" y1="1" x2="6" y2="4"></line>
                        <line x1="10" y1="1" x2="10" y2="4"></line>
                        <line x1="14" y1="1" x2="14" y2="4"></line>
                    </svg>
                    Buy me a coffee
                </a>
                <p class="mt-3 text-[11px] text-gray-500 font-medium uppercase tracking-wider">Support development to unlock Pro</p>
            </div>
            
        </div>
    </div>

    <script>
        // --- State ---
        let is24Hour = false;
        let isModalOpen = false;
        
        // Theme Colors
        const themes = [
            'text-white',
            'text-emerald-400',
            'text-sky-400',
            'text-amber-400',
            'text-rose-400',
            'text-fuchsia-400'
        ];
        let currentThemeIndex = 0;

        // DOM Elements
        const timeEl = document.getElementById('time');
        const ampmEl = document.getElementById('ampm');
        const dateEl = document.getElementById('date');
        const controlsEl = document.getElementById('controls');
        const settingsModal = document.getElementById('settingsModal');
        const settingsContent = document.getElementById('settingsContent');
        
        // --- Clock Logic ---
        function updateClock() {
            const now = new Date();
            
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            let ampm = '';

            if (!is24Hour) {
                ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12;
                hours = hours ? hours : 12; 
                ampmEl.textContent = ampm;
                ampmEl.classList.remove('hidden');
            } else {
                ampmEl.classList.add('hidden');
            }

            hours = hours.toString().padStart(2, '0');
            minutes = minutes.toString().padStart(2, '0');
            seconds = seconds.toString().padStart(2, '0');

            timeEl.textContent = `${hours}:${minutes}:${seconds}`;

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            dateEl.textContent = now.toLocaleDateString(undefined, options);
        }

        updateClock();
        setInterval(updateClock, 1000);

        // --- Event Listeners ---

        // Modal Logic
        const openModal = () => {
            isModalOpen = true;
            settingsModal.classList.remove('hidden');
            void settingsModal.offsetWidth; 
            settingsModal.classList.remove('opacity-0');
            settingsContent.classList.remove('scale-95');
            resetIdleTimer(); 
        };

        const closeModal = () => {
            isModalOpen = false;
            settingsModal.classList.add('opacity-0');
            settingsContent.classList.add('scale-95');
            setTimeout(() => settingsModal.classList.add('hidden'), 300);
            resetIdleTimer(); 
        };

        document.getElementById('settingsToggle').addEventListener('click', openModal);
        document.getElementById('closeModal').addEventListener('click', closeModal);
        
        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) closeModal();
        });

        // Format Toggle
        document.getElementById('formatToggle').addEventListener('click', () => {
            is24Hour = !is24Hour;
            updateClock();
        });

        // Color Toggle
        document.getElementById('colorToggle').addEventListener('click', () => {
            timeEl.classList.remove(themes[currentThemeIndex]);
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            timeEl.classList.add(themes[currentThemeIndex]);
            
            if (currentThemeIndex === 0) {
                timeEl.style.filter = '';
            } else {
                timeEl.style.filter = 'drop-shadow(0 0 20px currentColor)';
            }
        });

        // Fullscreen Toggle
        const fsEnterIcon = document.getElementById('fs-icon-enter');
        const fsExitIcon = document.getElementById('fs-icon-exit');

        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        document.getElementById('fullscreenToggle').addEventListener('click', toggleFullScreen);

        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                fsEnterIcon.classList.add('hidden');
                fsExitIcon.classList.remove('hidden');
            } else {
                fsEnterIcon.classList.remove('hidden');
                fsExitIcon.classList.add('hidden');
            }
        });

        // --- Idle Mouse/Touch Hiding Logic ---
        let idleTimer;
        
        function resetIdleTimer() {
            document.body.classList.remove('cursor-hidden');
            controlsEl.style.opacity = '1';
            controlsEl.style.transform = 'translateY(0)';
            controlsEl.style.pointerEvents = 'auto';

            clearTimeout(idleTimer);
            
            if (!isModalOpen) {
                idleTimer = setTimeout(() => {
                    document.body.classList.add('cursor-hidden');
                    controlsEl.style.opacity = '0';
                    controlsEl.style.transform = 'translateY(20px)';
                    controlsEl.style.pointerEvents = 'none';
                }, 3000);
            }
        }

        ['mousemove', 'mousedown', 'touchstart', 'keydown'].forEach(evt => 
            document.addEventListener(evt, resetIdleTimer, false)
        );

        resetIdleTimer();

    </script>
</body>
</html>
